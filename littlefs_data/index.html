<!doctype html>
<!--
  SAS Dashboard shell.

  Served as a static asset by the HTTP Server; there is no device-side
  sas_dashboard.c/.h module. js/dashboard.js builds the shell and the Home,
  Wi-Fi, BLE, Files, OTA, Logs, Account and Login views; js/terminal.js
  provides the Terminal view (window.SASTerminal) and must load first.
-->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAS Dashboard</title>
<link rel="stylesheet" href="css/style.css">

<div id="app">
  <!-- dashboard.js builds the header, nav, and view container here. -->
</div>

<script src="js/terminal.js"></script>
<script src="js/dashboard.js"></script>
</html>
